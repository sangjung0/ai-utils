[project]
name = "sjaipy"
version = "0.1.0"
description = "Custom AI utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2.0",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.23",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "torchvision>=0.18.0",
    "sjpy"
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.10",
    "notebook>=7.4.7",
]
test = [
    "pytest>=8.4.2",
    "pytest-dotenv>=0.5.2",
]

[tool.pytest.ini_options]
env_files=[".env"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sjaipy*"]

[tool.uv.sources]
# sjpy = {path = "modules/sjpy", editable = true}
